<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Good Company — preview</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="screen welcome" id="welcome" aria-labelledby="welcome-title">
      <div class="screen__body">
        <svg class="companion" viewBox="0 0 80 72" aria-hidden="true">
          <path
            class="blob--good"
            d="M40 6c9-1 15 7 22 11 8 4 14 12 12 20-2 9 3 15-4 20-8 6-8 15-19 16-10 1-15-7-23-6-9 1-17 5-21-4-5-9 2-13 2-21 0-9-5-15 2-20 7-6 14-15 21-16z"
          />
          <circle class="face" cx="31" cy="32" r="2.7" />
          <circle class="face" cx="49" cy="32" r="2.7" />
          <path class="face" d="M30 43c4 6 16 6 20 0" fill="none" stroke-width="2.2" stroke-linecap="round" />
        </svg>
        <h1 class="display" id="welcome-title">Health,<br />made<br />simple.</h1>
        <p class="lede">Your everyday partner for<br />feeling your best.</p>
      </div>
      <div class="screen__actions">
        <button class="button button--primary" type="button" id="start">Get started</button>
        <button class="button button--secondary" type="button" id="skip">Skip</button>
      </div>
    </section>

    <section class="screen feeling" id="feeling" aria-labelledby="feeling-title" hidden>
      <div class="progress">
        <button class="icon-button" type="button" id="back" aria-label="Back">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M10 3.5 5.5 8 10 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="progress__meter" aria-hidden="true">
          <div class="progress__fill"></div>
          <div class="progress__knob"></div>
        </div>
        <span class="progress__step">1/3</span>
        <span class="visually-hidden">Step 1 of 3. Later steps are not part of this preview.</span>
      </div>

      <div class="screen__body">
        <h1 class="heading" id="feeling-title">How are you<br />feeling<br />today?</h1>
        <p class="lede lede--center">Choose the feeling that fits<br />best.</p>

        <div class="moods" role="radiogroup" aria-labelledby="feeling-title">
          <label class="mood">
            <input type="radio" name="mood" value="good" />
            <svg class="mood__mark" viewBox="0 0 80 72" aria-hidden="true">
              <path class="blob--good" d="M40 6c9-1 15 7 22 11 8 4 14 12 12 20-2 9 3 15-4 20-8 6-8 15-19 16-10 1-15-7-23-6-9 1-17 5-21-4-5-9 2-13 2-21 0-9-5-15 2-20 7-6 14-15 21-16z" />
              <circle class="face" cx="31" cy="32" r="2.7" />
              <circle class="face" cx="49" cy="32" r="2.7" />
              <path class="face" d="M30 43c4 6 16 6 20 0" fill="none" stroke-width="2.2" stroke-linecap="round" />
            </svg>
            <span class="mood__label">Good</span>
          </label>
          <label class="mood">
            <input type="radio" name="mood" value="soso" />
            <svg class="mood__mark" viewBox="0 0 80 72" aria-hidden="true">
              <path class="blob--soso" d="M40 6c9-1 15 7 22 11 8 4 14 12 12 20-2 9 3 15-4 20-8 6-8 15-19 16-10 1-15-7-23-6-9 1-17 5-21-4-5-9 2-13 2-21 0-9-5-15 2-20 7-6 14-15 21-16z" />
              <circle class="face" cx="31" cy="33" r="2.2" />
              <circle class="face" cx="49" cy="33" r="2.2" />
              <path class="face" d="M30 45h20" fill="none" stroke-width="2.2" stroke-linecap="round" />
            </svg>
            <span class="mood__label">So-so</span>
          </label>
          <label class="mood">
            <input type="radio" name="mood" value="low" />
            <svg class="mood__mark" viewBox="0 0 80 72" aria-hidden="true">
              <path class="blob--low" d="M40 6c9-1 15 7 22 11 8 4 14 12 12 20-2 9 3 15-4 20-8 6-8 15-19 16-10 1-15-7-23-6-9 1-17 5-21-4-5-9 2-13 2-21 0-9-5-15 2-20 7-6 14-15 21-16z" />
              <path class="face" d="M24 27l7 3M56 27l-7 3" fill="none" stroke-width="2" stroke-linecap="round" />
              <circle class="face" cx="31" cy="34" r="2.4" />
              <circle class="face" cx="49" cy="34" r="2.4" />
              <path class="face" d="M30 49c4-6 16-6 20 0" fill="none" stroke-width="2.2" stroke-linecap="round" />
            </svg>
            <span class="mood__label">Low</span>
          </label>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>

      <div class="screen__actions">
        <button class="button button--primary" type="button" id="continue" disabled>Continue →</button>
      </div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
